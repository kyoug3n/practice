<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall</title>
  </head>
  <body>
    <main id="app">
      <header id="app-header">
        <h1>Recall</h1>
        <div id="app-userbar" hidden>
          <a id="current-user" aria-live="polite"></a>
          <button type="button" id="logout">Выйти</button>
        </div>
      </header>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="registration" aria-label="Регистрация" hidden>
        <h2>Создать аккаунт</h2>
        <form id="register-form">
          <input
            name="username"
            placeholder="Логин"
            aria-label="Логин"
            autocomplete="username"
            required
          />
          <input
            name="password"
            type="password"
            placeholder="Пароль"
            aria-label="Пароль"
            autocomplete="new-password"
            required
          />
          <button type="submit">Зарегистрироваться</button>
        </form>
        <button type="button" id="show-login">Уже есть аккаунт? Войти</button>
      </section>

      <section id="login" aria-label="Вход">
        <h2>Войти</h2>
        <form id="login-form">
          <input
            name="username"
            placeholder="Логин"
            aria-label="Логин"
            autocomplete="username"
            required
          />
          <input
            name="password"
            type="password"
            placeholder="Пароль"
            aria-label="Пароль"
            autocomplete="current-password"
            required
          />
          <p
            id="login-error"
            class="auth-error"
            role="alert"
            aria-hidden="true"
          ></p>
          <button type="submit">Войти</button>
        </form>
        <button type="button" id="show-registration">Создать аккаунт</button>
      </section>

      <section id="profile" aria-label="Публичный профиль" hidden>
        <h2>Публичный профиль</h2>
        <p id="profile-error" role="alert" hidden></p>
        <div id="profile-content" hidden>
          <dl id="profile-stats">
            <div>
              <dt>Пользователь</dt>
              <dd data-profile="username"></dd>
            </div>
            <div>
              <dt>Регистрация</dt>
              <dd data-profile="created_at"></dd>
            </div>
            <div>
              <dt>Карточки</dt>
              <dd data-profile="cards_count"></dd>
            </div>
            <div>
              <dt>Повторения</dt>
              <dd data-profile="reviews_count"></dd>
            </div>
            <div>
              <dt>Дни практики</dt>
              <dd data-profile="practice_days"></dd>
            </div>
            <div>
              <dt>Текущая серия</dt>
              <dd data-profile="current_streak"></dd>
            </div>
            <div>
              <dt>Лучшая серия</dt>
              <dd data-profile="longest_streak"></dd>
            </div>
          </dl>
        </div>
        <a id="profile-home" href="/">Вернуться в Recall</a>
      </section>

      <div id="workspace" hidden>
        <section id="stats" aria-label="Статистика">
          <span data-stat="due_today">сегодня: …</span>
          <span data-stat="due_week">за неделю: …</span>
          <span data-stat="streak">серия: …</span>
        </section>

        <section aria-label="Заметки">
          <div class="section-heading">
            <h2>Заметки</h2>
            <div class="section-actions">
              <button
                type="button"
                class="section-create section-filter"
                id="toggle-tag-filter"
                aria-controls="tag-filter-form"
                aria-expanded="false"
                aria-label="Фильтр по тегу"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M4 5h16l-6.5 7.2V18l-3 1.5v-7.3L4 5z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linejoin="round"
                    stroke-width="2"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="section-create"
                id="create-note"
                aria-controls="note-form"
                aria-expanded="false"
                aria-label="Новая заметка"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
          </div>
          <form id="tag-filter-form" hidden>
            <input
              name="tag"
              placeholder="Фильтр по тегу"
              aria-label="Фильтр по тегу"
            />
            <button type="submit">Применить фильтр</button>
            <button type="button" id="clear-tag-filter">Сбросить</button>
          </form>
          <form id="note-form" hidden>
            <label class="note-field">
              <span>Заголовок</span>
              <input
                name="title"
                placeholder="Заголовок"
                aria-label="Заголовок заметки"
                required
              />
            </label>
            <label class="note-field">
              <span>Теги</span>
              <input
                name="tags"
                placeholder="Через запятую"
                aria-label="Теги через запятую"
              />
            </label>
            <div id="note-book-picker"></div>
            <label class="note-field">
              <span>Содержание</span>
              <textarea
                name="body"
                placeholder="Текст заметки"
                aria-label="Текст заметки"
              ></textarea>
            </label>
            <fieldset id="note-links" aria-label="Связанные заметки">
              <legend class="note-links-label">Связанные заметки</legend>
              <div class="note-links-control">
                <div class="note-link-options"></div>
              </div>
            </fieldset>
            <div class="create-actions">
              <button type="submit">Добавить заметку</button>
              <button type="button" data-create-cancel>Отмена</button>
            </div>
          </form>
          <ul id="note-list"></ul>
          <p id="notes-empty" data-testid="notes-empty" hidden>
            Заметок нет. Нажмите +, чтобы создать.
          </p>
          <nav
            id="notes-pagination"
            class="notes-pagination"
            aria-label="Страницы заметок"
            hidden
          >
            <button
              type="button"
              id="notes-previous"
              aria-label="Предыдущая страница заметок"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="m14 6-6 6 6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </button>
            <span id="notes-page" aria-live="polite"></span>
            <button
              type="button"
              id="notes-next"
              aria-label="Следующая страница заметок"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="m10 6 6 6-6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </button>
          </nav>
        </section>

        <section aria-label="Повторение">
          <div class="section-heading">
            <h2>
              Карточки (<span id="queue-count" aria-live="polite">0</span>)
            </h2>
            <div class="section-actions">
              <button
                type="button"
                class="section-create card-edit-toggle"
                id="toggle-card-edit"
                aria-expanded="false"
                aria-pressed="false"
                aria-label="Изменить карточки"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="m4.75 16-.5 4 4-.5L19.75 8 16.25 4.5 4.75 16Zm9.5-9.5 3.5 3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="section-create"
                id="create-card"
                aria-label="Новая карточка"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
          </div>
          <form id="card-form" hidden>
            <label class="card-field">
              <span>Заметка</span>
              <select name="note_id" aria-label="Заметка для карточки" required>
                <option value="">Выберите заметку</option>
              </select>
            </label>
            <label class="card-field">
              <span>Вопрос</span>
              <input
                name="front"
                placeholder="Вопрос"
                aria-label="Вопрос карточки"
                required
              />
            </label>
            <label class="card-field">
              <span>Ответ</span>
              <textarea
                name="back"
                placeholder="Ответ карточки"
                aria-label="Ответ карточки"
                required
              ></textarea>
            </label>
            <div class="create-actions">
              <button type="submit">Создать карточку</button>
              <button type="button" data-create-cancel>Отмена</button>
            </div>
          </form>
          <div id="queue"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
