<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall</title>
  </head>
  <body>
    <main id="app">
      <header id="app-header">
        <h1>Recall</h1>
        <div id="app-userbar" hidden>
          <a id="current-user" aria-live="polite"></a>
          <button type="button" id="logout">Выйти</button>
        </div>
      </header>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="registration" aria-label="Регистрация">
        <h2>Создать аккаунт</h2>
        <form id="register-form">
          <input
            name="username"
            placeholder="Логин"
            aria-label="Логин"
            autocomplete="username"
            required
          />
          <input
            name="password"
            type="password"
            placeholder="Пароль"
            aria-label="Пароль"
            autocomplete="new-password"
            required
          />
          <button type="submit">Зарегистрироваться</button>
        </form>
        <button type="button" id="show-login">Уже есть аккаунт? Войти</button>
      </section>

      <section id="login" aria-label="Вход" hidden>
        <h2>Войти</h2>
        <form id="login-form">
          <input
            name="username"
            placeholder="Логин"
            aria-label="Логин"
            autocomplete="username"
            required
          />
          <input
            name="password"
            type="password"
            placeholder="Пароль"
            aria-label="Пароль"
            autocomplete="current-password"
            required
          />
          <button type="submit">Войти</button>
        </form>
        <button type="button" id="show-registration">Создать аккаунт</button>
      </section>

      <section id="profile" aria-label="Публичный профиль" hidden>
        <h2>Публичный профиль</h2>
        <p id="profile-error" role="alert" hidden></p>
        <div id="profile-content" hidden>
          <dl id="profile-stats">
            <div>
              <dt>Пользователь</dt>
              <dd data-profile="username"></dd>
            </div>
            <div>
              <dt>Регистрация</dt>
              <dd data-profile="created_at"></dd>
            </div>
            <div>
              <dt>Карточки</dt>
              <dd data-profile="cards_count"></dd>
            </div>
            <div>
              <dt>Повторения</dt>
              <dd data-profile="reviews_count"></dd>
            </div>
            <div>
              <dt>Дни практики</dt>
              <dd data-profile="practice_days"></dd>
            </div>
            <div>
              <dt>Текущая серия</dt>
              <dd data-profile="current_streak"></dd>
            </div>
            <div>
              <dt>Лучшая серия</dt>
              <dd data-profile="longest_streak"></dd>
            </div>
          </dl>
        </div>
        <a id="profile-home" href="/">Вернуться в Recall</a>
      </section>

      <div id="workspace" hidden>
        <section id="stats" aria-label="Статистика">
          <span data-stat="due_today">сегодня: …</span>
          <span data-stat="due_week">за неделю: …</span>
          <span data-stat="streak">серия: …</span>
        </section>

        <dialog id="create-panel" aria-labelledby="create-panel-title">
          <div class="create-panel-header">
            <h2 id="create-panel-title">Новая карточка</h2>
            <button type="button" id="create-close" aria-label="Закрыть">
              ×
            </button>
          </div>
          <form id="card-form" hidden>
            <select name="note_id" aria-label="Заметка для карточки" required>
              <option value="">Выберите заметку</option>
            </select>
            <input
              name="front"
              placeholder="Вопрос"
              aria-label="Вопрос карточки"
              required
            />
            <textarea
              name="back"
              placeholder="Ответ"
              aria-label="Ответ карточки"
              required
            ></textarea>
            <button type="submit">Создать карточку</button>
          </form>
        </dialog>

        <section aria-label="Заметки">
          <div class="section-heading">
            <h2>Заметки</h2>
            <div class="section-actions">
              <button
                type="button"
                class="section-create section-filter"
                id="toggle-tag-filter"
                aria-controls="tag-filter-form"
                aria-expanded="false"
                aria-label="Фильтр по тегу"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M4 5h16l-6.5 7.2V18l-3 1.5v-7.3L4 5z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linejoin="round"
                    stroke-width="2"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="section-create"
                id="create-note"
                aria-controls="note-form"
                aria-expanded="false"
                aria-label="Новая заметка"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
          </div>
          <form id="tag-filter-form" hidden>
            <input
              name="tag"
              placeholder="Фильтр по тегу"
              aria-label="Фильтр по тегу"
            />
            <button type="submit">Применить фильтр</button>
            <button type="button" id="clear-tag-filter">Сбросить</button>
          </form>
          <form id="note-form" hidden>
            <input
              name="title"
              placeholder="Заголовок"
              aria-label="Заголовок заметки"
              required
            />
            <input
              name="tags"
              placeholder="Теги (через запятую)"
              aria-label="Теги через запятую"
            />
            <textarea
              name="body"
              placeholder="Текст заметки"
              aria-label="Текст заметки"
            ></textarea>
            <button type="submit">Добавить заметку</button>
          </form>
          <ul id="note-list"></ul>
          <p id="notes-empty" data-testid="notes-empty" hidden>
            Заметок нет. Нажмите +, чтобы создать.
          </p>
          <nav
            id="notes-pagination"
            class="notes-pagination"
            aria-label="Страницы заметок"
            hidden
          >
            <button
              type="button"
              id="notes-previous"
              aria-label="Предыдущая страница заметок"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="m14 6-6 6 6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </button>
            <span id="notes-page" aria-live="polite"></span>
            <button
              type="button"
              id="notes-next"
              aria-label="Следующая страница заметок"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="m10 6 6 6-6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </button>
          </nav>
        </section>

        <section aria-label="Повторение">
          <div class="section-heading">
            <h2>Карточки</h2>
            <button
              type="button"
              class="section-create"
              id="create-card"
              aria-label="Новая карточка"
            >
              <span aria-hidden="true">+</span>
            </button>
          </div>
          <p id="queue-progress" aria-live="polite"></p>
          <div id="queue"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
