openapi: 3.1.0
info:
  title: Recall API
  version: 0.1.0
  description: |
    Personal knowledge base with spaced repetition.
    Capture notes, tag and link them, turn notes into cards, review on a
    daily queue, track simple stats.

    This contract is the floor: the acceptance suite (spec/acceptance/*.hurl)
    asserts the observable behaviour described here. It is deliberately loose.
    The exact scheduling interval table and the precise stats definitions are
    NOT pinned in this contract — that is part of the task.
servers:
  - url: http://localhost:8080
    description: Local backend (php -S / compose)

tags:
  - name: auth
  - name: health
  - name: notes
  - name: cards
  - name: reviews
  - name: stats
  - name: users

paths:
  /health:
    get:
      tags: [health]
      summary: Check API and database availability
      responses:
        "200":
          description: API and database are available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register:
    post:
      tags: [auth]
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationInput" }
      responses:
        "201":
          description: Registered user
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409":
          description: Username already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged-in user
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/me:
    get:
      tags: [auth]
      summary: Return the user of the current session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing, expired, or invalid session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended and browser cookie cleared
          headers:
            Set-Cookie:
              description: An expired HttpOnly session cookie.
              schema: { type: string }

  /notes:
    get:
      tags: [notes]
      summary: List notes, optionally filtered by tag
      parameters:
        - name: tag
          in: query
          required: false
          schema: { type: string }
          description: Return only notes carrying this tag.
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
    post:
      tags: [notes]
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [notes]
      summary: Get a note
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notes]
      summary: Update a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [notes]
      summary: Delete a note
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cards:
    get:
      tags: [cards]
      summary: List cards
      responses:
        "200":
          description: List of cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Card" }
    post:
      tags: [cards]
      summary: Create a card from a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [cards]
      summary: Get a card
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cards]
      summary: Delete a card
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reviews/queue:
    get:
      tags: [reviews]
      summary: Cards due for review now
      responses:
        "200":
          description: Due cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Card" }

  /reviews/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [reviews]
      summary: Grade a card and schedule the next review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade]
              properties:
                grade:
                  type: string
                  enum: [again, hard, good, easy]
      responses:
        "201":
          description: Recorded review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /stats:
    get:
      tags: [stats]
      summary: Review stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }

  /users/{username}:
    get:
      tags: [users]
      summary: Return a user's public learning profile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{2,31}$"
      responses:
        "200":
          description: Public learning profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Forbidden:
      description: Resource belongs to another user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok] }

    User:
      type: object
      required: [id, username, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        created_at: { type: string, format: date-time }

    RegistrationInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{2,31}$"
        password: { type: string, minLength: 12, maxLength: 72 }

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{2,31}$"
        password: { type: string, minLength: 1, maxLength: 72 }

    Note:
      type: object
      required: [id, title, body, tags, links, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        tags:
          type: array
          items: { type: string }
        links:
          type: array
          description: Ids of linked notes.
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NoteInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        tags:
          type: array
          items: { type: string }
        links:
          type: array
          items: { type: string, format: uuid }

    Card:
      type: object
      required: [id, note_id, front, back, ease, interval, due, created_at]
      properties:
        id: { type: string, format: uuid }
        note_id: { type: string, format: uuid }
        front: { type: string }
        back: { type: string }
        ease: { type: number }
        interval: { type: integer, description: Days until next review. }
        due: { type: string, format: date }
        created_at: { type: string, format: date-time }

    CardInput:
      type: object
      required: [note_id, front, back]
      properties:
        note_id: { type: string, format: uuid }
        front: { type: string, minLength: 1, maxLength: 4000 }
        back: { type: string, minLength: 1, maxLength: 4000 }

    Review:
      type: object
      required: [id, card_id, grade, interval, ease, next_due, created_at]
      properties:
        id: { type: string, format: uuid }
        card_id: { type: string, format: uuid }
        grade: { type: string, enum: [again, hard, good, easy] }
        interval: { type: integer }
        ease: { type: number }
        next_due: { type: string, format: date }
        created_at: { type: string, format: date-time }

    Stats:
      type: object
      required: [due_today, due_week, streak]
      properties:
        due_today: { type: integer }
        due_week: { type: integer }
        streak: { type: integer }

    PublicProfile:
      type: object
      required:
        [username, created_at, cards_count, reviews_count, practice_days, current_streak, longest_streak]
      properties:
        username: { type: string }
        created_at: { type: string, format: date-time }
        cards_count: { type: integer, minimum: 0 }
        reviews_count: { type: integer, minimum: 0 }
        practice_days: { type: integer, minimum: 0 }
        current_streak: { type: integer, minimum: 0 }
        longest_streak: { type: integer, minimum: 0 }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details:
          type: object
          additionalProperties: true
